name = "VirasoroProject"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["VirasoroProject"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.34.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# Pinned to the release tag matching lean-toolchain: doc-gen4's `main` tracks the
# next Lean release candidate, so an unpinned `main` breaks on every bump.
[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.34.0"
[[lean_lib]]
name = "VirasoroProject"
